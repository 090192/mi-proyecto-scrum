<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tienda de Ropa</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  margin:0;
  text-align:center;
}

h1{
  color:white;
  padding:20px;
}

h3{
  margin:10px 0;
}

p{
  font-weight:bold;
}

/* Buscador */
input{
  padding:10px;
  width:200px;
  border-radius:10px;
  border:none;
}

/* Productos */
.contenedor{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  padding:20px;
}

.card{
  background:white;
  padding:15px;
  border-radius:15px;
  width:220px;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

img{
  width:100%;
  border-radius:10px;
}

button{
  background:#ff6b6b;
  color:white;
  border:none;
  padding:8px;
  border-radius:8px;
  cursor:pointer;
  margin-top:5px;
}

button:hover{
  background:#ff4757;
}

/* Carrito y panel */
#carrito, #admin{
  background:white;
  margin:20px;
  padding:15px;
  border-radius:15px;
}

#carrito ul{
  list-style:none;
  padding:0;
}

#mensaje{
  color:white;
}
</style>
</head>

<body>

<h1>Tienda de Ropa 🛍️</h1>
<p style="color:white;">Bienvenido a nuestra tienda en línea</p>

<!-- Buscador -->
<input type="text" id="buscador" placeholder="Buscar producto..." onkeyup="buscar()">
<p id="mensaje"></p>

<!-- Productos -->
<div class="contenedor">

<div class="card">
<img src="https://images.unsplash.com/photo-1503341504253-dff4815485f1">
<h3>Playera Negra</h3>
<p>$150</p>
<button class="btn">Agregar</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1523381294911-8d3cead13475">
<h3>Sudadera</h3>
<p>$350</p>
<button class="btn">Agregar</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246">
<h3>Jeans</h3>
<p>$500</p>
<button class="btn">Agregar</button>
</div>

</div>

<!-- Carrito -->
<div id="carrito">
<h2>Carrito 🛒</h2>
<p id="contador">Productos: 0</p>
<ul id="lista"></ul>
<p id="total">Total: $0</p>
<button onclick="comprar()">Comprar</button>
</div>

<!-- Panel admin -->
<div id="admin">
<h2>Panel de administración (simulado)</h2>
<p>Total de productos agregados: <span id="totalAdmin">0</span></p>
</div>

<script>
let contador = 0;
let total = 0;

let productos = [
  {nombre: "Playera Negra", precio: 150},
  {nombre: "Sudadera", precio: 350},
  {nombre: "Jeans", precio: 500}
];

document.querySelectorAll(".btn").forEach((boton, index) => {

  boton.addEventListener("click", function(){

    contador++;
    total += productos[index].precio;

    document.getElementById("contador").innerText = "Productos: " + contador;
    document.getElementById("totalAdmin").innerText = contador;

    let li = document.createElement("li");
    li.textContent = productos[index].nombre + " - $" + productos[index].precio;
    document.getElementById("lista").appendChild(li);

    document.getElementById("total").innerText = "Total: $" + total;

  });

});

/* Botón comprar */
function comprar(){
  alert("Compra realizada con éxito 🛍️");
}

/* Buscador */
function buscar(){
  let input = document.getElementById("buscador").value.toLowerCase();
  let productos = document.getElementsByClassName("card");
  let encontrado = false;

  for(let i=0;i<productos.length;i++){
    let texto = productos[i].innerText.toLowerCase();
    
    if(texto.includes(input)){
      productos[i].style.display = "block";
      encontrado = true;
    } else {
      productos[i].style.display = "none";
    }
  }

  document.getElementById("mensaje").innerText = encontrado ? "" : "No se encontraron productos";
}
</script>

</body>
</html>
